# Render Blueprint: one web service (API + built web app on one URL) and a Postgres database.
# Render dashboard > New > Blueprint > pick this repository and branch.
services:
  - type: web
    name: payroll-tax-engine
    runtime: node
    plan: starter            # always on; "free" also works but sleeps after 15 minutes idle
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    # Creates/updates the schema and loads the tax database (safe to re-run; client data is kept), then starts the app.
    startCommand: npm run db:seed && npm start -w apps/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: payroll-db
          property: connectionString
      - key: APP_USER
        value: firstgen
      - key: APP_PASSWORD
        generateValue: true  # random password; see it under the service's Environment tab

databases:
  - name: payroll-db
    databaseName: payroll
    plan: basic-256mb        # "free" works for a trial but Render deletes free databases after 30 days
    ipAllowList: []          # reachable only from Render services
